<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación</title>
    {% load static %}<link rel="stylesheet" href="{% static 'ventas/app.css' %}">
</head>
<body class="container py-5">
    <div class="card col-md-6 mx-auto">
        <div class="card-body">
            <h3 class="card-title text-danger">¿Eliminar Venta #{{ venta.id }}?</h3>
            <p>Esta acción no se puede deshacer. Cliente: <strong>{{ venta.cliente|default:"Sin nombre" }}</strong></p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                <a href="{% url 'lista_ventas' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
